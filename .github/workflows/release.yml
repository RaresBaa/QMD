name: Build release jar

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8 and 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          # Gradle runs on 17 (listed last = default); the mod compiles with the Java 8 toolchain
          java-version: |
            8
            17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Use tag as mod version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^modVersion = .*/modVersion = ${VERSION}/" buildscript.properties
          echo "Building version ${VERSION}"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: QMD-${{ github.ref_name }}
          path: build/libs/*.jar

      - name: Pick release jar
        run: |
          mkdir dist
          find build/libs -name '*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' ! -name '*-api.jar' -exec cp {} dist/ \;
          ls -l dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          fail_on_unmatched_files: true
          generate_release_notes: true
